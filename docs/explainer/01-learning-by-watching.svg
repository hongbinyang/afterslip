<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="Imitation learning: the robot copies demonstration paths into the bin"><title>Imitation learning: the robot copies demonstration paths into the bin</title><style>
.bg{fill:#eef2f6}.ink{fill:#1c1c1a}.mut{fill:#6b6a64}.ln{stroke:#c9c4b8}
.robot{fill:#2f5d8a}.robotS{stroke:#2f5d8a}.good{fill:#3f8f5a}.goodS{stroke:#3f8f5a}
