[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "afterslip"
version = "0.0.0"
description = "Recover without forgetting: RL post-training of a pretrained flow-matching manipulation policy in MuJoCo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
# PROVISIONAL development setup. Runtime dependencies are meant to come from the
# environment lock files (docs/setup.md §4), and the package is installed with
# `pip install -e . --no-deps`. The lock files do not exist yet: until they do, a fresh
# clone cannot reproduce the environment. Creating environment.yml and the locks from
# environment.yml / requirements.in is part of increment D1 (milestone 0.0b).
dependencies = []

[tool.setuptools.packages.find]
include = ["afterslip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests of one function or class",
    "integration: several components against the real simulator",
    "smoke: end-to-end path at minimal size on a given platform",
]
# A test marked xfail that unexpectedly passes is reported as a failure.
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py38"
# Python sources only: the explainer SVG generator holds long inline SVG markup, code
# snippets in Markdown documents are illustrations, and third_party/ holds pinned upstream
# code that is used as published.
extend-exclude = ["docs/explainer", "*.md", "third_party"]

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes, import sorting, pyupgrade, bugbear, ruff-specific.
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
# Documentation and comments use Greek letters and symbols on purpose (π₀, ×, §).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
